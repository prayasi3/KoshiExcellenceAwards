# Install this as the Nginx virtual host for api.koshiexcellenceaward.com.
# TLS certificate directives are managed by your hosting control panel or
# Certbot, so they are intentionally not included here.
server {
    listen 80;
    server_name api.koshiexcellenceaward.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
